; VADA flight computer firmware: one project, one environment per Pico.
;
;   pio run -e pico_a              build Pico A (deployment computer)
;   pio run -e pico_b -t upload    build and flash Pico B (sensors, telemetry, logging)
;   pio test -e native             run the host unit tests (needs gcc/g++ on PATH)

[platformio]
default_envs = pico_a, pico_b

[pico]
; Pinned: this platform commit also pins arduino-pico (fd65f6d) and its toolchain.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = rpipico2
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
build_src_flags = -Wall -Wextra

[env:pico_a]
extends = pico
build_src_filter = +<pico_a/>
build_flags = -DBOARD_PICO_A

[env:pico_b]
extends = pico
build_src_filter = +<pico_b/>
build_flags =
    -DBOARD_PICO_B
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
lib_deps =
    sandeepmistry/LoRa@0.8.0

[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra -DUNITY_INCLUDE_DOUBLE
test_build_src = no
